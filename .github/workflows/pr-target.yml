name: PR target guard

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

jobs:
  validate-source:
    name: Validate master PR source
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require staging from this repository
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$SOURCE_BRANCH" != "staging" ||
                "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Only staging from this repository can merge into master."
            exit 1
          fi
