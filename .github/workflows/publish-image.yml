name: Publish image

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  publish:
    name: Publish AMD64 image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the commit-specific image
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/benchline-stats"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.title=Benchline Stats
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=benchline-amd64
          cache-to: type=gha,scope=benchline-amd64,mode=max

      - name: Record the published image
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          {
            printf '### Published image\n\n'
            printf 'Tag: `%s`\n\n' "$IMAGE"
            printf 'Digest reference: `%s@%s`\n' "$IMAGE_NAME" "$digest"
          } >> "$GITHUB_STEP_SUMMARY"
