name: CI

on:
  pull_request:
    branches: [staging, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the PR merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # next build includes TypeScript checking and service-worker generation.
      - name: Build and check TypeScript
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/benchline_build
          BETTER_AUTH_SECRET: build-only-configuration-not-a-runtime-secret
          BETTER_AUTH_URL: http://localhost:3000
        run: npm run build
